<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anbarasan P - Liquid Glass Portfolio</title>
    
    <!-- Modern Soft Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Liquid Glass Theme Variables */
        :root {
            /* Requested Colors */
            --pure-white: #ffffff;
            --sky-blue: #70c4ff;
            --yellow: #ffd54f;
            --light-green: #81c784;
            
            /* UI Colors */
            --bg-color: #f8f9fa;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            
            /* Liquid Glass Effect */
            --liquid-bg: rgba(255, 255, 255, 0.4);
            --liquid-border: rgba(255, 255, 255, 0.8);
            --liquid-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            --liquid-highlight: inset 0 0 20px rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #ebebf5;
            --liquid-bg: rgba(30, 30, 30, 0.4);
            --liquid-border: rgba(255, 255, 255, 0.15);
            --liquid-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --liquid-highlight: inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body {
            background-color: var(--pure-white);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 120px;
        }

        /* Ambient Liquid Background */
        .liquid-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-color);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.8;
            animation: liquidFlow 15s infinite alternate ease-in-out;
        }

        .blob-1 { width: 50vw; height: 50vw; background: var(--sky-blue); top: -10%; left: -10%; }
        .blob-2 { width: 45vw; height: 45vw; background: var(--yellow); bottom: -10%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 40vw; height: 40vw; background: var(--light-green); top: 30%; left: 30%; animation-delay: -10s; }

        @keyframes liquidFlow {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(50px, 80px) scale(1.2) rotate(20deg); }
        }

        /* Core Liquid Glass Class */
        .liquid-glass {
            background: var(--liquid-bg);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid var(--liquid-border);
            box-shadow: var(--liquid-shadow), var(--liquid-highlight);
            border-radius: 40px;
        }

        /* 3 Card Layout Container */
        .main-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* Individual Cards */
        .card {
            padding: 35px;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--sky-blue);
            background: var(--pure-white);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Profile Card Styles */
        .profile-img-wrap {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--sky-blue), var(--light-green));
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--pure-white);
        }

        .profile-name { text-align: center; font-size: 24px; font-weight: 800; }
        .profile-role { text-align: center; color: var(--text-muted); font-weight: 500; margin-bottom: 15px; }

        /* Projects Card Styles */
        .project-item {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--liquid-border);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--text-main);
            display: block;
            transition: all 0.3s;
        }

        .project-item:hover {
            background: var(--pure-white);
            transform: scale(1.02);
        }

        .project-item h4 { font-size: 16px; margin-bottom: 5px; }
        .project-item p { font-size: 13px; color: var(--text-muted); }

        /* Form Styles */
        .liquid-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--liquid-border);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        
        .liquid-input:focus {
            background: var(--pure-white);
            border-color: var(--sky-blue);
        }

        textarea.liquid-input { height: 100px; resize: none; }

        .submit-btn {
            width: 100%;
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 15px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover { transform: scale(0.98); }

        /* Floating Bottom Dock */
        .bottom-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 100px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 1000;
        }

        .dock-item {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .dock-item:hover, .dock-item.active {
            background: var(--pure-white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: var(--sky-blue);
            transform: translateY(-5px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; padding-bottom: 100px; }
            .bottom-dock { width: 90%; justify-content: space-around; }
        }
    </style>
</head>
<body>

    <!-- Liquid Animated Background -->
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 3 Center Cards -->
    <div class="main-container">
        
        <!-- Card 1: Profile -->
        <div class="card liquid-glass">
            <div class="card-title"><i class="fas fa-user"></i> <span data-en="Profile" data-ta="சுயவிவரம்">Profile</span></div>
            <div class="profile-img-wrap">
                <!-- UPDATED PROFILE IMAGE HERE -->
                <img src="42495_2.png" alt="Anbarasan" class="profile-img">
            </div>
            <div class="profile-name">Anbarasan P</div>
            <div class="profile-role" data-en="Student & Developer" data-ta="மாணவர் & டெவலப்பர்">Student & Developer</div>
            <p style="text-align: center; color: var(--text-muted); font-size: 14px;" 
               data-en="Designing pure, liquid web experiences." 
               data-ta="சிறந்த வலைத்தளங்களை வடிவமைப்பதில் ஆர்வம் கொண்டவன்.">
               Designing pure, liquid web experiences.
            </p>
        </div>

        <!-- Card 2: Projects -->
        <div class="card liquid-glass">
            <div class="card-title"><i class="fas fa-layer-group"></i> <span data-en="Projects" data-ta="படைப்புகள்">Projects</span></div>
            
            <a href="#" class="project-item">
                <h4 data-en="Liquid Glass UI" data-ta="திரவக் கண்ணாடி UI">Liquid Glass UI</h4>
                <p data-en="iOS 26 Concept Design" data-ta="iOS 26 கான்செப்ட் டிசைன்">iOS 26 Concept Design</p>
            </a>
            
            <a href="#" class="project-item">
                <h4 data-en="Web App Development" data-ta="வெப் ஆப் உருவாக்கம்">Web App Development</h4>
                <p data-en="HTML, CSS, JavaScript" data-ta="HTML, CSS, JavaScript">HTML, CSS, JavaScript</p>
            </a>

            <a href="#" class="project-item">
                <h4 data-en="Python Automation" data-ta="பைதான் ஆட்டோமேஷன்">Python Automation</h4>
                <p data-en="Data processing scripts" data-ta="தரவு பகுப்பாய்வு">Data processing scripts</p>
            </a>
        </div>

        <!-- Card 3: Contact Form -->
        <div class="card liquid-glass">
            <div class="card-title"><i class="fas fa-paper-plane"></i> <span data-en="Connect" data-ta="தொடர்புக்கு">Connect</span></div>
            
            <form action="YOUR_FORMSPREE_LINK_HERE" method="POST" style="flex: 1; display: flex; flex-direction: column;">
                <input type="text" name="name" placeholder="Name" required class="liquid-input">
                <input type="email" name="email" placeholder="Email" required class="liquid-input">
                <textarea name="message" placeholder="Message..." required class="liquid-input"></textarea>
                <button type="submit" class="submit-btn" data-en="Send Message" data-ta="அனுப்பு">Send Message</button>
            </form>
        </div>

    </div>

    <!-- Floating Bottom Dock -->
    <div class="bottom-dock liquid-glass">
        <a href="#" class="dock-item active" title="Home"><i class="fas fa-home"></i></a>
        <a href="https://github.com/anbarasanp142007-coder" target="_blank" class="dock-item" title="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/anbarasanp14978" target="_blank" class="dock-item" title="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
        
        <!-- Controls in Dock -->
        <button id="lang-btn" class="dock-item" style="font-weight: 800; font-size: 16px;">TA</button>
        <button id="theme-btn" class="dock-item"><i class="fas fa-moon"></i></button>
    </div>

    <script>
        // Language Toggle
        const langBtn = document.getElementById('lang-btn');
        let currentLang = 'en';

        langBtn.addEventListener('click', () => {
            currentLang = (currentLang === 'en') ? 'ta' : 'en';
            langBtn.innerText = (currentLang === 'en') ? 'TA' : 'EN';
            
            document.querySelectorAll('[data-en][data-ta]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
        });

        // Theme Toggle
        const themeBtn = document.getElementById('theme-btn');
        const root = document.documentElement;
        
        themeBtn.addEventListener('click', () => {
            const isLight = root.getAttribute('data-theme') === 'light';
            if (isLight) {
                root.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                root.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        });
    </script>
</body>
                    </html>
